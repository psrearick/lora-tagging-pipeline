[project]
requires-python = ">=3.12,<3.13"
name = "lora_pipeline"
version = "0.1.0"
dependencies = [
    "torch (>=2.10.0,<3.0.0)",
    "torchvision (>=0.25.0,<0.26.0)",
    "ftfy (>=6.3.1,<7.0.0)",
    "regex (>=2026.2.28,<2027.0.0)",
    "open-clip-torch (>=3.3.0,<4.0.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "imagededup (>=0.3.3.post2,<0.4.0)",
    "gallery-dl (>=1.31.10,<2.0.0)",
    "opencv-python (>=4.13.0.92,<5.0.0.0)",
    "click (>=8.1,<9.0)",
]

[project.scripts]
lora-pipeline = "lora_pipeline.cli:cli"

[tool.poetry]
package-mode = true
packages = [{include = "lora_pipeline", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
